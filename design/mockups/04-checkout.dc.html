<div style="padding: 16px; display: flex; flex-direction: column; gap: 14px">

<option>MX +52</option>
<option>US +1</option>
</select>
<input id="tel" type="tel" placeholder="10 dígitos" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 12px; border: 2px solid #1B2A5C; border-radius: 4px; font-family: 'Nunito', sans-serif; font-size: 16px; color: #1B2A5C; background: #FFF8F2">

<section style="background: #FFFFFF; border: 2px solid #1B2A5C; border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px">

<label style="display: flex; align-items: center; gap: 10px; height: 50px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #1B2A5C; border-radius: 4px; background: #FFFFFF; font-size: 15px; font-weight: 800">
<input type="radio" name="when" style="width: 20px; height: 20px; margin: 0; accent-color: #F08A24">Programar hora</label>
</div>
</section>

<input type="radio" name="pay" checked="" style="width: 20px; height: 20px; margin: 0; accent-color: #F08A24">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="1.5" stroke="#1B2A5C" stroke-width="2.2"></rect><circle cx="12" cy="12" r="2.6" stroke="#1B2A5C" stroke-width="2.2"></circle></svg>

</label>
<div style="display: flex; align-items: center; gap: 12px; height: 54px; box-sizing: border-box; padding: 0 12px; border: 1.5px dashed #8A7A6E; border-radius: 4px; background: #FFFFFF; color: #5A4636; font-size: 15px; font-weight: 800">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 2px solid #1B2A5C; border-radius: 6px; background: #FFD23F">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800">4 productos · recoger en tienda</span>
<span style="font-family: 'Lilita One', sans-serif; font-size: 22px">$185 MXN</span>
</div>
<a href="#" style="font-weight: 900; font-size: 14px">Ver detalle</a>
</div>
</div>

<div style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 12px 16px 24px; background: #FFFFFF; border-top: 2px solid #1B2A5C; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; text-align: center; font-size: 13px; font-weight: 700; color: #5A4636">Te mandamos un código por SMS para confirmar.</p>
<button type="button" style="height: 54px; border: 2px solid #1B2A5C; border-radius: 6px; background: #F08A24; color: #1B2A5C; font-family: 'Lilita One', sans-serif; font-size: 20px; box-shadow: 3px 3px 0 #1B2A5C">Enviar código por SMS</button>
</div>
</div>
