<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>01 · Menú</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2A5C}a:hover{color:#C62A1E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; color: #1B2A5C">

<header style="background: #1B2A5C; padding: 54px 16px 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px">
<img src="/_blob/d282362831bdcac6681da5bf9b9802bf" alt="Logo de Burritos El Pesado" style="width: 56px; height: 56px; box-sizing: border-box; border: 3px solid #FFD23F; border-radius: 6px; object-fit: cover; background: #FCE6D4">
<div style="display: flex; flex-direction: column; gap: 3px">
<h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 25px; line-height: 1; color: #FFD23F; -webkit-text-stroke: 1.5px #C62A1E; paint-order: stroke fill; text-shadow: 2px 2px 0 #C62A1E">BURRITOS EL PESADO</h1>
<button type="button" style="display: flex; align-items: center; gap: 6px; padding: 0; min-height: 24px; border: none; background: none; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700">Recoger en tienda · Lo antes posible
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="#FFD23F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 46px; box-sizing: border-box; padding: 0 14px; border-radius: 6px; background: #FFFFFF">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="#5A4636" stroke-width="2.2"></circle><path d="M16 16l4 4" stroke="#5A4636" stroke-width="2.2" stroke-linecap="round"></path></svg>
<input type="search" aria-label="Buscar en el menú" placeholder="Buscar en el menú" style="flex: 1; min-width: 0; border: none; outline: none; background: none; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600; color: #1B2A5C">
</label>
</header>

<div role="group" aria-label="Categorías" style="display: flex; gap: 8px; padding: 16px 16px 0; overflow: hidden; white-space: nowrap">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{c.pressed}}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border: 2px solid #1B2A5C; border-radius: 4px; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800">{{c.label}}</button>
</sc-for>
</div>

<div style="padding: 20px 16px 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 2px solid #1B2A5C; border-radius: 6px; background: #F08A24; box-shadow: 3px 3px 0 #1B2A5C">
<div style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border: 2px solid #1B2A5C; border-radius: 4px; background: #FFD23F; display: flex; align-items: center; justify-content: center; font-size: 28px" role="img" aria-label="Foto pendiente">🌯</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-family: 'Lilita One', sans-serif; font-size: 18px">Desde las 2 PM</p>
<p style="margin: 0; font-size: 13px; line-height: 1.3; font-weight: 700">Discada, bistec y colita de pavo en burrito o montada.</p>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 20px">
<h2 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 22px">Burritos</h2>
<span style="font-size: 13px; font-weight: 700; color: #5A4636">17 opciones</span>
</div>

<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<article style="display: flex; gap: 14px; padding: 16px 0; border-bottom: 1.5px solid #E9C9AE">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 19px; line-height: 1.15">{{it.name}}</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.35; color: #5A4636">{{it.desc}}</p>
<p style="margin: 0; font-size: 16px; font-weight: 900">{{it.price}}</p>
</div>
<div style="width: 96px; height: 96px; flex-shrink: 0; position: relative">
<div role="img" aria-label="Foto pendiente" style="width: 96px; height: 96px; box-sizing: border-box; border: 2px solid #1B2A5C; border-radius: 6px; background: #FFD23F; display: flex; align-items: center; justify-content: center; font-size: 44px">🌯</div>
<button type="button" aria-label="Agregar {{it.name}}" style="position: absolute; right: -6px; bottom: -6px; width: 44px; height: 44px; padding: 0; border: 2px solid #1B2A5C; border-radius: 4px; background: #F08A24; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="#1B2A5C" stroke-width="2.8" stroke-linecap="round"></path></svg>
</button>
</div>
</article>
</sc-for>
</div>

<a href="M03-Pedido.dc.html" style="position: absolute; left: 16px; bottom: 94px; width: 358px; height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #1B2A5C; border-radius: 6px; background: #F08A24; box-shadow: 3px 3px 0 #1B2A5C; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1B2A5C">
<span style="display: flex; align-items: center; gap: 10px">
<span style="width: 28px; height: 28px; border-radius: 4px; background: #1B2A5C; color: #FFD23F; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center">4</span>
<span style="font-family: 'Lilita One', sans-serif; font-size: 19px">Ver pedido</span>
</span>
<span style="font-size: 17px; font-weight: 900">$185</span>
</a>

<nav aria-label="Navegación principal" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 82px; box-sizing: border-box; padding: 10px 40px 26px; background: #1B2A5C; display: flex; justify-content: space-between; align-items: center">
<a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #FFD23F; font-size: 12px; font-weight: 900; min-width: 44px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="#FFD23F" stroke-width="2.4" stroke-linecap="round"></path></svg>Menú</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #FFFFFF; font-size: 12px; font-weight: 700; min-width: 44px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"></path><path d="M9 8h6M9 12h6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg>Pedidos</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #FFFFFF; font-size: 12px; font-weight: 700; min-width: 44px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="4" stroke="#FFFFFF" stroke-width="2.2"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg>Cuenta</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cats = ["Burritos", "Montadas", "Desayunos", "Después de las 2 PM", "Extras"];
    return {
      chips: cats.map(function (c, i) {
        var on = i === 0;
        return { label: c, pressed: on ? "true" : "false", bg: on ? "#1B2A5C" : "#FFFFFF", fg: on ? "#FFD23F" : "#1B2A5C" };
      }),
      items: [
        { name: "Asado", desc: "Asado de puerco en chile colorado, estilo Chihuahua.", price: "$45" },
        { name: "Arriero", desc: "Carne de res guisada estilo arriero, con chile y papa.", price: "$40" },
        { name: "Mole", desc: "Carne deshebrada bañada en mole casero.", price: "$40" },
        { name: "Relleno", desc: "Chile relleno de queso, capeado.", price: "$55" }
      ]
    };
  }
}
</script>
</body>
</html>
