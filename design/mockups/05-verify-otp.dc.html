<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; color: #1B2A5C">

<header style="height: 104px; box-sizing: border-box; padding: 48px 16px 0; background: #1B2A5C; display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="Regresar" style="width: 44px; height: 44px; border: none; border-radius: 4px; background: #FFD23F; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#1B2A5C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
<h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 24px; color: #FFFFFF">Confirma tu teléfono</h1>
</header>

<div style="padding: 32px 16px 0; display: flex; flex-direction: column; gap: 22px">
<div style="width: 72px; height: 72px; border: 2px solid #1B2A5C; border-radius: 6px; background: #FFD23F; box-shadow: 3px 3px 0 #1B2A5C; display: flex; align-items: center; justify-content: center">
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="1.5" stroke="#1B2A5C" stroke-width="2.2"></rect><path d="M10 18.5h4" stroke="#1B2A5C" stroke-width="2.2" stroke-linecap="round"></path><path d="M9 8h6M9 11.5h4" stroke="#C62A1E" stroke-width="2.2" stroke-linecap="round"></path></svg>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 32px; line-height: 1.1">Escribe el código</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #5A4636">Te mandamos 6 dígitos por SMS al <strong style="color: #1B2A5C">+52 ••• ••• ••67</strong>.</p>
</div>

<div role="group" aria-label="Código de 6 dígitos" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<input aria-label="Dígito 1" value="4" maxlength="1" inputmode="numeric" style="width: 100%; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #1B2A5C; border-radius: 4px; background: #FFFFFF; font-family: 'Lilita One', sans-serif; font-size: 28px; color: #1B2A5C">
<input aria-label="Dígito 2" value="8" maxlength="1" inputmode="numeric" style="width: 100%; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #1B2A5C; border-radius: 4px; background: #FFFFFF; font-family: 'Lilita One', sans-serif; font-size: 28px; color: #1B2A5C">
<input aria-label="Dígito 3" value="1" maxlength="1" inputmode="numeric" style="width: 100%; height: 60px; box-sizing: border-box; text-align: center; border: 2px solid #1B2A5C; border-radius: 4px; background: #FFFFFF; font-family: 'Lilita One', sans-serif; font-size: 28px; color: #1B2A5C">
<input aria-label="Dígito 4" maxlength="1" inputmode="numeric" style="width: 100%; height: 60px; box-sizing: border-box; text-align: center; border: 3px solid #F08A24; border-radius: 4px; background: #FFF8F2; box-shadow: 3px 3px 0 #1B2A5C; font-family: 'Lilita One', sans-serif; font-size: 28px; color: #1B2A5C">
<input aria-label="Dígito 5" maxlength="1" inputmode="numeric" style="width: 100%; height: 60px; box-sizing: border-box; text-align: center; border: 1.5px solid #8A7A6E; border-radius: 4px; background: #FFFFFF; font-family: 'Lilita One', sans-serif; font-size: 28px; color: #1B2A5C">
<input aria-label="Dígito 6" maxlength="1" inputmode="numeric" style="width: 100%; height: 60px; box-sizing: border-box; text-align: center; border: 1.5px solid #8A7A6E; border-radius: 4px; background: #FFFFFF; font-family: 'Lilita One', sans-serif; font-size: 28px; color: #1B2A5C">
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<p style="margin: 0; font-size: 14px; font-weight: 700; color: #5A4636">Reenviar código en 0:42</p>
<a href="#" style="font-size: 14px; font-weight: 900">Cambiar número</a>
</div>

<div style="display: flex; gap: 10px; padding: 12px 14px; border: 1.5px dashed #1B2A5C; border-radius: 6px; background: #FFF8F2">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9" stroke="#1B2A5C" stroke-width="2.2"></circle><path d="M12 11v5M12 7.5v.5" stroke="#1B2A5C" stroke-width="2.4" stroke-linecap="round"></path></svg>
<p style="margin: 0; font-size: 14px; line-height: 1.45; font-weight: 600">Solo te lo pedimos para confirmar el pedido y avisarte cuando esté listo.</p>
</div>
</div>

<div style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; padding: 16px 16px 24px; background: #FFFFFF; border-top: 2px solid #1B2A5C">
<button type="button" disabled="" style="width: 100%; height: 54px; border: 2px solid #8A7A6E; border-radius: 6px; background: #EADBCF; color: #5A4636; font-family: 'Lilita One', sans-serif; font-size: 20px">Confirmar pedido</button>
</div>
</div>
