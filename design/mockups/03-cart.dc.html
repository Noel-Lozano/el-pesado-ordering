<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>03 · Tu pedido</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0}
a{color:#1B2A5C}a:hover{color:#C62A1E}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Nunito', system-ui, sans-serif; color: #1B2A5C">

<header style="height: 104px; box-sizing: border-box; padding: 48px 16px 0; background: #1B2A5C; display: flex; align-items: center; gap: 12px">
<a href="M01-Menu.dc.html" aria-label="Regresar al menú" style="width: 44px; height: 44px; border-radius: 4px; background: #FFD23F; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#1B2A5C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Lilita One', sans-serif; font-weight: 400; font-size: 24px; color: #FFFFFF">Tu pedido</h1>
</header>

<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid #1B2A5C; border-radius: 6px">
<div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: #FFD23F; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z" stroke="#1B2A5C" stroke-width="2.2"></path><circle cx="12" cy="10" r="2.2" stroke="#1B2A5C" stroke-width="2.2"></circle></svg>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 16px; font-weight: 900">Recoger en tienda</p>
<p style="margin: 0; font-size: 14px; font-weight: 600; color: #5A4636">Lo antes posible</p>
</div>
<a href="#" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 800">Cambiar</a>
</div>

<div style="padding: 0 14px; border: 2px solid #1B2A5C; border-radius: 6px">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: {{l.divider}}">
<div role="img" aria-label="Foto pendiente" style="width: 52px; height: 52px; flex-shrink: 0; box-sizing: border-box; border: 2px solid #1B2A5C; border-radius: 6px; background: #FFD23F; display: flex; align-items: center; justify-content: center; font-size: 26px">{{l.emoji}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<p style="margin: 0; font-size: 15px; font-weight: 900">{{l.name}}</p>
<p style="margin: 0; font-size: 13px; font-weight: 600; color: #5A4636">{{l.meta}}</p>
<p style="margin: 0; font-size: 14px; font-weight: 900">{{l.price}}</p>
</div>
<div style="display: flex; align-items: center; gap: 2px; height: 50px; box-sizing: border-box; padding: 0 2px; border: 2px solid #1B2A5C; border-radius: 4px">
<button type="button" aria-label="Quitar uno de {{l.name}}" style="width: 44px; height: 42px; border: none; border-radius: 4px; background: #FFF8F2; color: #1B2A5C; font-size: 20px; font-weight: 900">−</button>
<span style="min-width: 18px; text-align: center; font-size: 16px; font-weight: 900">{{l.qty}}</span>
<button type="button" aria-label="Agregar otro {{l.name}}" style="width: 44px; height: 42px; border: none; border-radius: 4px; background: #1B2A5C; color: #FFD23F; font-size: 20px; font-weight: 900">+</button>
</div>
</div>
</sc-for>
</div>

<div style="padding: 14px; border: 2px solid #1B2A5C; border-radius: 6px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; font-size: 15px">
<span style="font-weight: 600; color: #5A4636">Subtotal (4 productos)</span>
<span style="font-weight: 800">$185</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: 'Lilita One', sans-serif; font-size: 22px">Total</span>
<span style="font-family: 'Lilita One', sans-serif; font-size: 24px">$185 MXN</span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1.5px dashed #1B2A5C; border-radius: 6px; background: #FFF8F2">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="1.5" stroke="#1B2A5C" stroke-width="2.2"></rect><circle cx="12" cy="12" r="2.6" stroke="#1B2A5C" stroke-width="2.2"></circle></svg>
<p style="margin: 0; font-size: 14px; font-weight: 700">Pagas en efectivo al recoger</p>
</div>
</div>

<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 104px; box-sizing: border-box; padding: 16px 16px 0; background: #FFFFFF; border-top: 2px solid #1B2A5C">
<a href="M04-Checkout.dc.html" style="height: 54px; box-sizing: border-box; border: 2px solid #1B2A5C; border-radius: 6px; background: #F08A24; color: #1B2A5C; box-shadow: 3px 3px 0 #1B2A5C; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: 'Lilita One', sans-serif; font-size: 20px">Continuar · $185</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var line = "1.5px solid #E9C9AE";
    return {
      lines: [
        { name: "Asado", meta: "Burrito", price: "$90", qty: 2, emoji: "🌯", divider: line },
        { name: "Discada", meta: "Montada · Desde 2 PM", price: "$80", qty: 1, emoji: "🌯", divider: line },
        { name: "Kool-Aid", meta: "Extras", price: "$15", qty: 1, emoji: "🥤", divider: "none" }
      ]
    };
  }
}
</script>
</body>
</html>
